plugins { id 'java' }
group = 'cn.mits'
version = '1.1.0'

// Compile against Java 17 APIs without requiring a separate JDK 17 toolchain.
repositories {
    mavenCentral()
    maven { name = 'ViaVersion'; url = 'https://repo.viaversion.com/everything' }
}

dependencies {
    // ViaProxy supplies the runtime API; it must not be bundled into the plugin.
    compileOnly('net.raphimc:ViaProxy:3.4.14') { transitive = false }
    // Bundle SQLite JDBC and its native libraries so the plugin is self-contained.
    implementation('org.xerial:sqlite-jdbc:3.50.3.0')
    implementation('org.bouncycastle:bcprov-jdk18on:1.81')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveFileName = 'nekogate-viaproxy-plugin.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        // Dependency signatures become invalid when their classes/resources are
        // merged into this plugin JAR. Remove signature metadata from dependencies.
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.EC'
        exclude 'META-INF/SIG-*'
        exclude 'META-INF/INDEX.LIST'
    }
}

tasks.register('apiJar', Jar) {
    archiveBaseName = 'nekogate-api'
    archiveVersion = project.version
    from sourceSets.main.output
    include 'cn/mits/nekogate/api/**'
}

tasks.named('build') {
    dependsOn tasks.named('apiJar')
}

// Install only the runnable ViaProxy plugin. The API-only JAR is kept in
// build/libs for extension developers and must not be loaded as a plugin.
tasks.register('installPlugin', Copy) {
    dependsOn tasks.named('build')
    from(tasks.named('jar'))
    into new File(project.projectDir.parentFile, 'plugins')
}
