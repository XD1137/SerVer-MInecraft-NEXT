plugins { id 'java' }
group = 'cn.mits'
version = '1.1.0'

repositories {
    mavenCentral()
    maven { name = 'ViaVersion'; url = 'https://repo.viaversion.com/everything' }
}

dependencies {
    compileOnly('net.raphimc:ViaProxy:3.4.14') { transitive = false }
    implementation('org.xerial:sqlite-jdbc:3.50.3.0')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveFileName = 'nekogate-viaproxy-plugin.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.register('apiJar', Jar) {
    archiveBaseName = 'nekogate-api'
    archiveVersion = project.version
    from sourceSets.main.output
    include 'cn/mits/nekogate/api/**'
}

tasks.named('build') {
    dependsOn tasks.named('apiJar')
}

// Install only the runnable ViaProxy tunnel plugin.
// Remove the obsolete Bukkit/Spigot bridge JAR from earlier builds.
tasks.register('installPlugin', Copy) {
    dependsOn tasks.named('build')
    doFirst {
        delete new File(project.projectDir.parentFile, 'plugins/nekogate-authme-bridge.jar')
    }
    from(tasks.named('jar'))
    into new File(project.projectDir.parentFile, 'plugins')
}
